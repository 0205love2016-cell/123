<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>雙福消防分隊 115 年出勤案件超連結總覽</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --primary-bg: #eff6ff;
            --accent: #dc2626;
            --accent-bg: #fef2f2;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --warning: #d97706;
            --warning-bg: #fffbeb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 80px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        /* App 頂端導航條 */
        .app-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
            color: white;
            padding: 24px 20px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
        }
        .app-title-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .app-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .app-subtitle {
            font-size: 13px;
            color: #93c5fd;
            margin-top: 4px;
        }

        /* 摘要數據晶片 */
        .metrics-chips {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .metrics-chips::-webkit-scrollbar {
            display: none;
        }
        .chip {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 8px 14px;
            border-radius: 9999px;
            white-space: nowrap;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chip strong {
            font-size: 15px;
            color: #ffffff;
        }

        /* 手機黏性操作區 (Sticky Bar) */
        .sticky-controls {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(12px);
            padding: 10px 0;
            margin-bottom: 12px;
        }
        .search-container {
            position: relative;
            margin-bottom: 10px;
        }
        .search-input {
            width: 100%;
            height: 48px;
            padding: 0 44px 0 16px;
            font-size: 16px; /* 防止 iOS 點擊輸入框自動縮放 */
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .search-input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            background: #cbd5e1;
            color: #475569;
            border: none;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }

        /* 橫向滾動篩選按鈕列 */
        .filter-scroll-wrapper {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .filter-scroll-wrapper::-webkit-scrollbar {
            display: none;
        }
        .filter-pill {
            flex-shrink: 0;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .filter-pill:active {
            transform: scale(0.96);
        }
        .filter-pill.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 2px 4px rgba(30, 58, 138, 0.2);
        }

        /* 功能按鈕列 (切換模式與複製) */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 8px;
        }
        .view-toggle-group {
            display: flex;
            background: #e2e8f0;
            padding: 2px;
            border-radius: var(--radius-sm);
        }
        .view-btn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
        }
        .view-btn.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .btn-copy-action {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-copy-action:active {
            background: #f1f5f9;
        }

        /* 手機卡片列表模式 (Card View) - 手機預設最佳化 */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .case-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .case-card:active {
            transform: scale(0.99);
            background: #f8fafc;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .card-badges {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .card-idx {
            font-family: ui-monospace, monospace;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-month {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .badge-crash {
            background: var(--accent-bg);
            color: var(--accent);
            border: 1px solid #fecaca;
        }
        .badge-sick {
            background: #f0f9ff;
            color: #0284c7;
            border: 1px solid #bae6fd;
        }
        .badge-trauma {
            background: var(--warning-bg);
            color: var(--warning);
            border: 1px solid #fde68a;
        }
        .badge-status {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid #bbf7d0;
        }
        
        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid #f1f5f9;
            padding-top: 8px;
            margin-top: 2px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .card-time {
            font-family: ui-monospace, monospace;
        }
        .card-open-pill {
            color: var(--primary-light);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* 電腦表格模式 (Table View) */
        .table-view-container {
            display: none;
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .table-responsive {
            max-height: 70vh;
            overflow-y: auto;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            padding: 12px 14px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:hover td {
            background-color: #f8fafc;
        }
        .table-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .table-link:hover {
            text-decoration: underline;
        }

        /* 分頁載入更多按鈕 (Load More) */
        .pagination-bar {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .btn-load-more {
            width: 100%;
            max-width: 380px;
            height: 48px;
            background: var(--surface);
            border: 1.5px solid var(--primary-light);
            color: var(--primary-light);
            font-size: 15px;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-load-more:active {
            transform: scale(0.98);
            background: var(--primary-bg);
        }
        .btn-load-all {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            padding: 4px;
        }

        /* 浮動回到頂部按鈕 (FAB) */
        .fab-top {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: var(--shadow-lg);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.2s;
        }
        .fab-top:active {
            transform: scale(0.9);
        }

        /* 空狀態 */
        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border);
            display: none;
        }

        /* 電腦螢幕優化 (寬度 > 768px 時預設提供表格檢視) */
        @media (min-width: 769px) {
            .app-header { padding: 32px; }
            .app-title { font-size: 24px; }
            .cards-list.desktop-table-mode { display: none; }
            .table-view-container.desktop-table-mode { display: block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頂端看板 -->
        <header class="app-header">
            <div class="app-title-group">
                <div>
                    <h1 class="app-title">雙福消防分隊 115 年出勤總覽</h1>
                    <p class="app-subtitle">115/01/01 ~ 115/09/30 全期非空跑案件超連結速查</p>
                </div>
            </div>
            <div class="metrics-chips">
                <div class="chip">總案件：<strong id="totalCountDisplay">1,075</strong> 件</div>
                <div class="chip">發布率：<strong>100%</strong></div>
                <div class="chip">空跑過濾：<strong>172</strong> 件</div>
                <div class="chip">涵蓋：<strong>01 ~ 09 月</strong></div>
            </div>
        </header>

        <!-- 手機操作區 (Sticky) -->
        <div class="sticky-controls">
            <!-- 搜尋框 -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="搜尋案件（如：車禍、急病、01/02、1324619）..." autocomplete="off">
                <button class="search-clear" id="searchClearBtn" onclick="clearSearch()">✕</button>
            </div>

            <!-- 月份橫向滑動列 -->
            <div class="filter-scroll-wrapper" id="monthFilterGroup">
                <button class="filter-pill active" data-month="ALL">全部月份</button>
                <button class="filter-pill" data-month="01月">01月 (82)</button>
                <button class="filter-pill" data-month="02月">02月 (87)</button>
                <button class="filter-pill" data-month="03月">03月 (83)</button>
                <button class="filter-pill" data-month="04月">04月 (77)</button>
                <button class="filter-pill" data-month="05月">05月 (117)</button>
                <button class="filter-pill" data-month="06月">06月 (158)</button>
                <button class="filter-pill" data-month="07月">07月 (136)</button>
                <button class="filter-pill" data-month="08月">08月 (171)</button>
                <button class="filter-pill" data-month="09月">09月 (164)</button>
            </div>

            <!-- 勤務類別滑動列 -->
            <div class="filter-scroll-wrapper" id="catFilterGroup" style="margin-top: 6px;">
                <button class="filter-pill active" data-cat="ALL">全部類別</button>
                <button class="filter-pill" data-cat="車禍救護">車禍救護</button>
                <button class="filter-pill" data-cat="急病救護">急病救護</button>
                <button class="filter-pill" data-cat="創傷救護">創傷救護</button>
            </div>
        </div>

        <!-- 狀態與檢視切換列 -->
        <div class="action-bar">
            <span>顯示 <strong id="visibleCount" style="color: var(--primary);">0</strong> / 1075 件</span>
            <div style="display: flex; gap: 8px;">
                <button class="btn-copy-action" onclick="copyCurrentLinks()">複製超連結</button>
                <div class="view-toggle-group">
                    <button class="view-btn active" id="btnCardView" onclick="setViewMode('card')">卡片</button>
                    <button class="view-btn" id="btnTableView" onclick="setViewMode('table')">表格</button>
                </div>
            </div>
        </div>

        <!-- 卡片式清單 (手機預設極致體驗) -->
        <div class="cards-list" id="cardsContainer"></div>

        <!-- 傳統表格清單 (電腦排版切換) -->
        <div class="table-view-container" id="tableContainer">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">項次</th>
                            <th style="width: 70px;">月份</th>
                            <th style="width: 160px;">出勤時間</th>
                            <th style="width: 90px;">類別</th>
                            <th>新聞稿標題與超連結 (點擊開啟)</th>
                            <th style="width: 140px;">上版排程 (D+1)</th>
                            <th style="width: 70px;">狀態</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 無搜尋結果提示 -->
        <div class="empty-state" id="emptyState">
            <p style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">查無符合條件的案件</p>
            <p style="font-size: 13px;">請嘗試更換關鍵字或點擊「全部月份」重置篩選。</p>
        </div>

        <!-- 分頁控制 / 載入更多 -->
        <div class="pagination-bar" id="paginationBar">
            <button class="btn-load-more" id="loadMoreBtn" onclick="loadMore()">
                <span>載入更多案件</span>
                <span id="loadMoreCount" style="font-size: 12px; font-weight: normal; opacity: 0.8;"></span>
            </button>
            <button class="btn-load-all" onclick="loadAll()">一次載入全部案件 (可能稍微耗電)</button>
        </div>
    </div>

    <!-- 浮動回到頂部按鈕 (FAB) -->
    <button class="fab-top" id="fabTop" onclick="scrollToTop()" title="回到頂部">↑</button>

        const PAGE_SIZE = 40; // 手機每批載入 40 筆，保持 60fps 順暢
        let renderedCount = 0;
        let filteredCases = [...ALL_CASES];
        
        let currentMonth = 'ALL';
        let currentCat = 'ALL';
        let currentSearch = '';
        let currentView = window.innerWidth <= 768 ? 'card' : 'card'; // 手機與電腦均預設卡片，支援點選表格

        // DOM 元素
        const cardsContainer = document.getElementById('cardsContainer');
        const tableContainer = document.getElementById('tableContainer');
        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');
        const visibleCount = document.getElementById('visibleCount');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const loadMoreCount = document.getElementById('loadMoreCount');
        const paginationBar = document.getElementById('paginationBar');
        const emptyState = document.getElementById('emptyState');
        const fabTop = document.getElementById('fabTop');

        function getCatBadge(cat) {
            if (cat === '車禍救護') return 'badge-crash';
            if (cat === '創傷救護') return 'badge-trauma';
            return 'badge-sick';
        }

        function renderBatch(append = true) {
            if (!append) {
                cardsContainer.innerHTML = '';
                tableBody.innerHTML = '';
                renderedCount = 0;
            }

            const nextBatch = filteredCases.slice(renderedCount, renderedCount + PAGE_SIZE);
            if (nextBatch.length === 0 && renderedCount === 0) {
                emptyState.style.display = 'block';
                paginationBar.style.display = 'none';
                visibleCount.innerText = '0';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            const cardsFragment = document.createDocumentFragment();
            const tableFragment = document.createDocumentFragment();

            nextBatch.forEach(c => {
                const catClass = getCatBadge(c.category);
                
                // 1. 建立手機卡片
                const card = document.createElement('a');
                card.className = 'case-card';
                card.href = c.url || '#';
                card.target = '_blank';
                card.innerHTML = `
                    <div class="card-top">
                        <span class="card-idx">#${c.index}</span>
                        <div class="card-badges">
                            <span class="badge badge-month">${c.month}</span>
                            <span class="badge ${catClass}">${c.category}</span>
                            <span class="badge badge-status">已發布</span>
                        </div>
                    </div>
                    <div class="card-title">${c.title}</div>
                    <div class="card-meta-row">
                        <span class="card-time">⏱️ ${c.case_time}</span>
                        <span class="card-open-pill">開啟頁面 ↗</span>
                    </div>
                `;
                cardsFragment.appendChild(card);

                // 2. 建立表格列
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="card-idx">${c.index}</td>
                    <td><span class="badge badge-month">${c.month}</span></td>
                    <td class="card-time">${c.case_time}</td>
                    <td><span class="badge ${catClass}">${c.category}</span></td>
                    <td><a href="${c.url}" target="_blank" class="table-link">${c.title}</a></td>
                    <td class="card-time" style="color: #64748b;">${c.sdate}</td>
                    <td><span class="badge badge-status">已發布</span></td>
                `;
                tableFragment.appendChild(tr);
            });

            cardsContainer.appendChild(cardsFragment);
            tableBody.appendChild(tableFragment);

            renderedCount += nextBatch.length;
            visibleCount.innerText = filteredCases.length;

            // 控制載入更多按鈕
            if (renderedCount >= filteredCases.length) {
                paginationBar.style.display = 'none';
            } else {
                paginationBar.style.display = 'flex';
                loadMoreCount.innerText = `(已顯示 ${renderedCount} / ${filteredCases.length})`;
            }
        }

        function loadMore() {
            renderBatch(true);
        }

            const remaining = filteredCases.slice(renderedCount);

                card.href = c.url || '#';
                card.target = '_blank';
                card.innerHTML = `
                    <div class="card-top">
                        <span class="card-idx">#${c.index}</span>
                        <div class="card-badges">
                            <span class="badge badge-month">${c.month}</span>
                            <span class="badge ${catClass}">${c.category}</span>
                            <span class="badge badge-status">已發布</span>
                        </div>
                    </div>
                    <div class="card-title">${c.title}</div>
                    <div class="card-meta-row">
                        <span class="card-time">⏱️ ${c.case_time}</span>
                        <span class="card-open-pill">開啟頁面 ↗</span>
                    </div>
                `;
                cardsFragment.appendChild(card);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="card-idx">${c.index}</td>
                    <td><span class="badge badge-month">${c.month}</span></td>
                    <td class="card-time">${c.case_time}</td>
                    <td><span class="badge ${catClass}">${c.category}</span></td>
                    <td><a href="${c.url}" target="_blank" class="table-link">${c.title}</a></td>
                    <td class="card-time" style="color: #64748b;">${c.sdate}</td>
                    <td><span class="badge badge-status">已發布</span></td>
                `;
                tableFragment.appendChild(tr);
            });
            cardsContainer.appendChild(cardsFragment);
            tableBody.appendChild(tableFragment);
            renderedCount = filteredCases.length;
            paginationBar.style.display = 'none';
        }

        function applyFilters() {
            const query = currentSearch.toLowerCase();
            filteredCases = ALL_CASES.filter(c => {
                const matchMonth = (currentMonth === 'ALL' || c.month === currentMonth);
                const matchCat = (currentCat === 'ALL' || c.category === currentCat);
                const matchSearch = (!query || 
                    c.title.toLowerCase().includes(query) || 
                    c.case_time.includes(query) ||
                    (c.case_id && c.case_id.includes(query)) ||
                    (c.url && c.url.includes(query))
                );
                return matchMonth && matchCat && matchSearch;
            });
            renderBatch(false);
        }

        // 搜尋事件
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value.trim();
            searchClearBtn.style.display = currentSearch ? 'flex' : 'none';
            applyFilters();
        });

        function clearSearch() {
            searchInput.value = '';
            currentSearch = '';
            searchClearBtn.style.display = 'none';
            applyFilters();
        }

        // 月份篩選按鈕
        document.querySelectorAll('#monthFilterGroup .filter-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#monthFilterGroup .filter-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMonth = btn.getAttribute('data-month');
                btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                applyFilters();
            });
        });

        // 類別篩選按鈕
        document.querySelectorAll('#catFilterGroup .filter-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#catFilterGroup .filter-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCat = btn.getAttribute('data-cat');
                btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                applyFilters();
            });
        });

        // 檢視模式切換 (卡片 / 表格)
        function setViewMode(mode) {
            currentView = mode;
            if (mode === 'card') {
                document.getElementById('btnCardView').classList.add('active');
                document.getElementById('btnTableView').classList.remove('active');
                cardsContainer.style.display = 'flex';
                tableContainer.style.display = 'none';
            } else {
                document.getElementById('btnCardView').classList.remove('active');
                document.getElementById('btnTableView').classList.add('active');
                cardsContainer.style.display = 'none';
                tableContainer.style.display = 'block';
            }
        }

        // 回到頂部按鈕邏輯
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                fabTop.style.display = 'flex';
            } else {
                fabTop.style.display = 'none';
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 複製超連結功能
        function copyCurrentLinks() {
            const links = filteredCases.map(c => `${c.title} | ${c.url}`);
            navigator.clipboard.writeText(links.join('\n')).then(() => {
                alert(`已複製當前篩選的 ${links.length} 筆超連結至剪貼簿！`);
            }).catch(() => {
                alert('複製失敗，請檢視權限。');
            });
        }

        // 初始化載入
        setViewMode('card');
        renderBatch(false);
    </script>
</body>
</html>
